name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nudge
          POSTGRES_PASSWORD: nudge
          POSTGRES_DB: nudge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nudge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The values in .env.test are used as-is, except the database, whose user differs here.
      DATABASE_URL: postgres://nudge:nudge@localhost:5432/nudge

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Create the tables
        run: npm run db:test

      - name: Start the app (fake Twilio, web server and worker)
        run: |
          npm run start:test > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not start"; cat app.log; exit 1

      - name: Test
        run: npm test

      - name: Show the app log if anything failed
        if: failure()
        run: cat app.log

      - name: Dependency audit
        run: npm audit --audit-level=high
